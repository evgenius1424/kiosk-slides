name: Release skills

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        working-directory: skills
        run: |
          for skill in kiosk-slides-write kiosk-slides-render; do
            zip -qr "../$skill.zip" "$skill"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" kiosk-slides-*.zip --clobber
